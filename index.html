<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon carnet de bord d'orientation</title>
<style>
:root{--ink:#1d2140;--muted:#5d6385;--bg:#f3f1ff;--card:#fff;--navy:#1F3864;--r:18px;--shadow:0 6px 22px rgba(40,30,110,.10)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:radial-gradient(1200px 500px at 10% -10%,#e0d9ff 0,transparent 60%),radial-gradient(900px 500px at 100% 0,#ffe3f0 0,transparent 55%),var(--bg);line-height:1.5;min-height:100vh}
h1,h2,h3,h4{margin:0;line-height:1.2}
button{font:inherit;cursor:pointer}
a{color:#3b3bd6}
.hud{position:sticky;top:0;z-index:50;background:rgba(20,22,56,.96);color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.hud-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hud .brand{font-weight:800;font-size:15px}
.hud .ptxt{font-size:14px;font-weight:700}
.gbar{flex:1;min-width:120px;height:12px;background:#ffffff26;border-radius:999px;overflow:hidden}
.gbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7cf29a,#ffd166,#ff8fab);border-radius:999px;transition:width .5s}
.gpct{font-weight:800;font-size:14px;min-width:40px;text-align:right}
.hsave{font-size:12px;opacity:.85}
.hbtn{border:0;border-radius:10px;padding:6px 12px;font-weight:800;background:#ffffff26;color:#fff}
.warnbar{display:none;background:#fff3cd;color:#664d03;padding:8px 16px;text-align:center;font-weight:700;font-size:14px}
.warnbar.on{display:block}
nav#tabs{max-width:1100px;margin:14px auto 0;padding:0 16px;display:flex;gap:8px;overflow-x:auto}
nav#tabs button{flex:0 0 auto;border:0;border-radius:14px;padding:10px 14px;background:#fff;color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
nav#tabs button.active{background:var(--c,#1F3864);color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px 16px 80px}
.view{display:none;animation:pop .35s ease}
.view.on{display:block}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(135deg,#1F3864,#674EA7 60%,#A64D79);color:#fff;border-radius:26px;padding:34px 28px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"🧭";position:absolute;right:-10px;bottom:-30px;font-size:170px;opacity:.12}
.hero h1{font-size:clamp(26px,5vw,42px);margin-bottom:8px}
.hero p{max-width:640px;font-size:17px;margin:6px 0}
.hero .tag{display:inline-block;background:#ffffff26;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;margin-bottom:12px}
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:18px;max-width:720px}
.who input{width:100%;border:0;border-radius:12px;padding:12px 14px;font:inherit;background:#ffffffee;color:var(--ink)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-top:18px}
.card h2{font-size:22px;margin-bottom:6px;color:var(--navy)}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.howto div{background:#f6f4ff;border-radius:14px;padding:12px 14px;font-size:15px}
.howto b{display:block;font-size:22px}
.quests{display:grid;gap:12px;margin-top:12px}
.quest{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;border:0;text-align:left;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 2px 10px rgba(30,20,90,.10);border-left:8px solid var(--c);transition:transform .15s;color:var(--ink)}
.quest:hover{transform:translateX(4px)}
.quest .ic{font-size:30px;width:52px;height:52px;border-radius:14px;background:var(--l);display:grid;place-items:center}
.quest .t{font-weight:800}
.quest .s{font-size:14px;color:var(--muted)}
.quest .mini{display:block;height:8px;background:#e8e6f6;border-radius:999px;margin-top:8px;overflow:hidden;max-width:320px}
.quest .mini i{display:block;height:100%;background:var(--c);width:0;transition:width .4s}
.quest .pc{font-weight:800;color:var(--c);font-size:14px}
.banner{background:var(--c);color:#fff;border-radius:24px;padding:22px 24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.banner .big{position:absolute;right:14px;top:-6px;font-size:96px;opacity:.18}
.banner small{font-weight:800;letter-spacing:1.5px;opacity:.9}
.banner h2{font-size:clamp(22px,4vw,32px);margin:4px 0 8px}
.banner p{margin:4px 0;max-width:760px}
.banner .meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.pill{background:#ffffff2e;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.sbar{height:10px;background:#ffffff40;border-radius:999px;margin-top:14px;overflow:hidden}
.sbar i{display:block;height:100%;width:0;background:#fff;border-radius:999px;transition:width .4s}
.situ{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:12px}
.situ div{background:#ffffff26;border-radius:14px;padding:10px 14px;font-size:14px}
.mission{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-top:18px;border-top:6px solid var(--c);position:relative}
.mission.saved{border-top-color:#1b8a3f}
.mhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.mnum{width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800}
.mission.saved .mnum{background:#1b8a3f}
.mhead h3{font-size:19px;flex:1;min-width:200px}
.mode{border-radius:999px;padding:4px 12px;font-size:13px;font-weight:800}
.mode.solo{background:#e7f6ec;color:#1d7a3c}
.mode.duo{background:#fde8f1;color:#b0245f}
.mode.opt{background:#fff3cd;color:#8a5a00}
.story{background:var(--l);border-radius:12px;padding:10px 14px;margin:6px 0 12px;font-size:15px}
.instr{color:var(--muted);font-style:italic;margin:4px 0 12px}
.reslinks{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 12px;font-size:14px}
.reslinks a{background:#eef0ff;border-radius:999px;padding:4px 12px;text-decoration:none;font-weight:700}
.reslinks a:hover{background:#dfe3ff}
.msave{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:2px dashed #e3e0f5}
.mstat{font-weight:700;font-size:14px;color:var(--muted)}
.mission.saved .mstat{color:#1b8a3f}
.stamp{position:absolute;right:18px;top:14px;border:4px solid #1b8a3f;color:#1b8a3f;border-radius:12px;padding:2px 12px;font-weight:900;letter-spacing:2px;transform:rotate(-8deg);opacity:0;pointer-events:none;background:#fff}
.stamp.go{animation:stamp 1.4s ease}
@keyframes stamp{0%{opacity:0;transform:rotate(-8deg) scale(2.4)}25%{opacity:1;transform:rotate(-8deg) scale(1)}80%{opacity:1}100%{opacity:0}}
.miss{outline:3px solid #e63946;outline-offset:3px;border-radius:12px;animation:shake .4s}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative;cursor:pointer}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:10px 14px;border-radius:999px;background:#f1f0fb;border:2px solid transparent;font-weight:600;transition:all .15s;user-select:none}
.chip:hover span{transform:translateY(-2px);background:var(--l)}
.chip input:checked + span{background:var(--c);color:#fff;border-color:var(--c);transform:scale(1.04);box-shadow:0 4px 12px rgba(0,0,0,.18)}
.chip input:focus-visible + span{outline:3px solid #ffb703}
.cnt{display:inline-block;margin-top:12px;font-weight:800;color:var(--c);background:var(--l);border-radius:999px;padding:4px 12px}
.cnt.full{background:var(--c);color:#fff}
.stylecard{display:none;margin-top:14px;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,#fff7d6,#ffe3f0);border:2px dashed #ffb703}
.stylecard.on{display:block;animation:pop .4s}
.fld{display:block;margin:10px 0}
.fl{display:block;font-weight:700;margin-bottom:4px}
.pre{display:block;font-style:normal;color:var(--c);font-weight:700;margin-bottom:4px}
textarea,input[type=text],input[type=date]{width:100%;border:2px solid #e3e0f5;border-radius:12px;padding:10px 12px;font:inherit;background:#fcfbff;color:var(--ink)}
textarea{resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--c);box-shadow:0 0 0 4px var(--l)}
input[readonly]{background:var(--l);font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.qcard{background:#faf9ff;border:2px solid #ece9fb;border-radius:14px;padding:12px}
.qcard .qn{font-weight:800;color:var(--c)}
.qcard.done{background:var(--l);border-color:var(--c)}
.branches{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.branches button{flex:1;min-width:140px;border:0;border-radius:14px;padding:14px;font-weight:800;background:#f1f0fb;color:var(--ink)}
.branches button.on{background:var(--c);color:#fff}
.root{text-align:center;background:var(--c);color:#fff;font-weight:800;border-radius:14px;padding:12px;max-width:260px;margin:0 auto 4px}
.arrow{text-align:center;font-size:22px;color:var(--c)}
.bl{display:none;margin-top:10px}
.bl.on{display:flex;gap:8px;flex-wrap:wrap}
.bl .tag{background:var(--l);border-radius:999px;padding:8px 14px;font-weight:700}
.bl-note{display:none;margin-top:10px;color:var(--muted);font-size:15px}
.bl-note.on{display:block}
.draw,.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:800;background:var(--c);color:#fff;text-decoration:none;display:inline-block}
.btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
.btn:hover,.draw:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.profcard{margin-top:12px;padding:14px;border-radius:14px;background:var(--l);border:2px dashed var(--c);font-weight:700;display:none}
.profcard.on{display:block;animation:pop .3s}
.tw{overflow-x:auto;border-radius:14px;border:2px solid #ece9fb}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:8px;border-bottom:1px solid #ece9fb;vertical-align:top;text-align:left}
th{background:var(--c);color:#fff}
td:first-child{font-weight:700;background:var(--l);min-width:140px}
td textarea{min-height:44px;padding:6px 8px;font-size:14px}
.stars{display:inline-flex;gap:2px}
.stars input{position:absolute;opacity:0}
.stars label{font-size:28px;cursor:pointer;color:#d5d2e8}
.stars label.on{color:#ffb703}
.step{display:grid;grid-template-columns:44px 1fr;gap:12px;margin:14px 0}
.step .sn{width:44px;height:44px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800}
.step .sub{color:var(--muted);font-size:14px;margin-bottom:4px}
.preview{background:#1d2140;color:#fff;border-radius:16px;padding:16px 18px;margin-top:12px;white-space:pre-wrap;min-height:90px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.timer{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--c)}
.timer.alert{color:#d62828}
.ex{background:#fff8e1;border-left:6px solid #ffb703;border-radius:10px;padding:10px 14px;margin:8px 0}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.plan{border-radius:16px;padding:14px;border:3px solid var(--pc);background:#fff}
.plan h4{margin:0 0 4px;color:var(--pc);font-size:20px}
.plan .sub{color:var(--muted);font-size:14px;margin-bottom:6px}
.bil{border:2px solid #ece9fb;border-radius:14px;padding:12px 14px;margin:12px 0}
.bil .crit{font-size:14px;color:var(--muted);margin-bottom:6px}
.bil ul{margin:4px 0 10px;padding-left:20px;font-size:14px}
.lv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.lv label{cursor:pointer}
.lv input{position:absolute;opacity:0}
.lv span{display:block;text-align:center;padding:9px 6px;border-radius:12px;font-weight:800;font-size:14px;border:3px solid var(--lc);color:var(--lc);background:#fff}
.lv input:checked + span{background:var(--lc);color:#fff}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
/* quiz */
.quiz{background:linear-gradient(160deg,#faf9ff,#fff);border:3px solid var(--c);border-radius:20px;padding:16px}
.qz-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:800;margin-bottom:6px}
.qz-badge{background:var(--c);color:#fff;border-radius:999px;padding:3px 12px;font-size:13px}
.qz-intro{margin:2px 0 12px;color:var(--muted);font-size:15px}
.qz-card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 16px rgba(30,20,90,.10);animation:pop .3s}
.qz-n{font-size:13px;font-weight:800;color:var(--c)}
.qz-dots{display:flex;gap:5px;margin:6px 0}
.qz-dots i{width:22px;height:6px;border-radius:99px;background:#e3e0f5}
.qz-dots i.d{background:var(--c)}
.qz-dots i.c{background:var(--c);opacity:.5}
.qz-emoji{font-size:44px;text-align:center}
.qz-q{font-size:19px;font-weight:700;text-align:center;margin:6px 0 14px}
.qz-opts{display:grid;gap:10px}
.qz-opts.two{grid-template-columns:1fr 1fr}
.qz-opt{border:3px solid #e3e0f5;background:#fff;border-radius:14px;padding:14px 12px;font-weight:800;font-size:16px;color:var(--ink);transition:transform .12s}
.qz-opt:hover:not(:disabled){transform:translateY(-3px);border-color:var(--c)}
.qz-opt.good{background:#dff3e6;border-color:#1b8a3f;color:#14602d}
.qz-opt.bad{background:#fde0e0;border-color:#d62828;color:#8c1c1c}
.qz-fb{margin-top:12px;border-radius:12px;padding:0}
.qz-fb.ok,.qz-fb.ko{padding:10px 14px}
.qz-fb.ok{background:#e7f6ec;color:#14602d}
.qz-fb.ko{background:#fff1e0;color:#8a4b00}
.qz-fb .btn{margin-top:10px}
.qz-res{text-align:center;padding:18px;animation:pop .4s}
.qz-score{font-size:56px;font-weight:900;color:var(--c)}
.qz-rate{font-weight:800;font-size:18px}
.qz-ord{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ord-col h4{margin-bottom:8px;font-size:15px}
.ord-pool{display:grid;gap:8px}
.ord-it,.mt-b{border:3px solid #e3e0f5;background:#fff;border-radius:12px;padding:10px 12px;text-align:left;font-weight:700;color:var(--ink)}
.ord-it:hover,.mt-b:hover:not(:disabled){border-color:var(--c);transform:translateY(-2px)}
.ord-done{margin:0;padding-left:22px;display:grid;gap:8px}
.ord-done li{background:#dff3e6;border-radius:10px;padding:8px 10px;font-weight:700;animation:pop .3s}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mt-col{display:grid;gap:8px;align-content:start}
.mt-b.sel{background:var(--l);border-color:var(--c)}
.mt-b.done{background:#dff3e6;border-color:#1b8a3f;color:#14602d}
.clues{list-style:none;padding:0;margin:8px 0}
.clues li{background:var(--l);border-radius:12px;padding:10px 14px;margin:6px 0;font-weight:600}
.clues li.new{animation:pop .4s;border:2px solid var(--c)}
.more{margin:6px 0 12px}
/* parcoursup timeline */
.cd{background:linear-gradient(135deg,#0F766E,#14b8a6);color:#fff;border-radius:16px;padding:14px 18px;font-weight:700;margin-top:14px}
.tl{list-style:none;padding:0;margin:14px 0 0;position:relative}
.tl:before{content:"";position:absolute;left:21px;top:6px;bottom:6px;width:4px;background:#d9ece9;border-radius:4px}
.tl li{position:relative;padding:6px 0 14px 60px}
.tl .dot{position:absolute;left:0;top:4px;width:46px;height:46px;border-radius:50%;background:#fff;border:4px solid #bfe3de;display:grid;place-items:center;font-size:22px}
.tl li.past .dot{background:#dff3e6;border-color:#1b8a3f}
.tl li.cur .dot{background:#fff3cd;border-color:#ffb703;box-shadow:0 0 0 6px #ffb70033;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px #ffb70011}}
.tl .tt{font-weight:800}
.tl .td{color:#0F766E;font-weight:700;font-size:14px}
.tl .tx{color:var(--muted);font-size:14px}
.tl .here{display:inline-block;background:#ffb703;color:#442c00;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:900;margin-left:6px}
.callout{background:#e6f6f4;border-left:6px solid #0F766E;border-radius:12px;padding:10px 14px;margin:12px 0}
.linkrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
/* resources */
.rcard{background:#fff;border-radius:16px;box-shadow:var(--shadow);margin-top:14px;border-left:8px solid var(--c)}
.rcard summary{cursor:pointer;padding:14px 18px;font-weight:800;font-size:17px;list-style:none}
.rcard summary small{display:block;font-weight:600;color:var(--muted);font-size:13px}
.rcard summary::-webkit-details-marker{display:none}
.rcard summary:before{content:"▶ ";color:var(--c)}
.rcard[open] summary:before{content:"▼ "}
.rbody{padding:0 18px 18px}
.rbody h4{margin:14px 0 4px;color:var(--c)}
.rbody ul{margin:4px 0;padding-left:20px}
.facts{display:flex;gap:8px;flex-wrap:wrap}
.facts span{background:var(--l);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.warn{background:#fff3cd;border-left:6px solid #ffb703;border-radius:10px;padding:8px 12px;margin:10px 0;font-size:14px}
.ins{margin:8px 0}
.ins .bar{display:flex;height:26px;border-radius:8px;overflow:hidden;font-size:12px;font-weight:800;color:#fff}
.ins .bar i{display:grid;place-items:center;font-style:normal}
.ins .e{background:#1b8a3f}.ins .f{background:#3b82f6}.ins .o{background:#9aa0b8}
.legend{font-size:12px;color:var(--muted)}
.rtitle{margin-top:26px;font-size:20px;color:var(--navy)}
/* dossier */
.dsec{margin-top:18px;border-left:8px solid var(--c);padding-left:14px}
.dsec h3{color:var(--c)}
.dm{background:#faf9ff;border-radius:12px;padding:10px 14px;margin:10px 0}
.dm h4{font-size:16px}
.dm dt{font-weight:700;margin-top:6px;font-size:14px;color:var(--muted)}
.dm dd{margin:0 0 4px;white-space:pre-wrap}
.ds{font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;margin-left:6px}
.ds.ok{background:#dff3e6;color:#14602d}
.ds.no{background:#fff1e0;color:#8a4b00}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.cert{display:none;text-align:center;background:linear-gradient(135deg,#fff7d6,#ffe3f0);border:4px solid #ffb703;border-radius:22px;padding:28px 18px;margin-top:18px}
.cert.on{display:block;animation:pop .5s}
.cert h2{font-size:26px;color:#8a5a00}
.cert .nm{font-size:30px;font-weight:800;margin:10px 0;color:var(--navy)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,160px);background:#1d2140;color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;z-index:99;transition:transform .35s;max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
.conf{position:fixed;top:-30px;font-size:28px;z-index:98;pointer-events:none;animation:fall 2.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (max-width:640px){.qz-ord,.mt{grid-template-columns:1fr}.quest{grid-template-columns:auto 1fr}.quest .pc{grid-column:2}}
@media print{
  body{background:#fff}
  .hud,nav#tabs,.navrow,.actions,.btn,#toast,.conf,.warnbar{display:none!important}
  .view{display:none!important}
  .view[data-view="dos"]{display:block!important}
  .dm,.dsec{break-inside:avoid}
}
</style>
</head>
<body>
<div class="warnbar" id="warn">⚠️ Ton navigateur ne garde pas la sauvegarde automatique : télécharge ta sauvegarde (onglet « Mon dossier ») avant de fermer !</div>
<div class="hud">
  <div class="hud-in">
    <div class="brand">🧭 Carnet d'orientation</div>
    <div class="ptxt" id="hudTxt">0 / 0 missions enregistrées</div>

    <p>${esc(r.extra||"")}</p><p><b>${verdict(r.rate)}</b></p>
    <button type="button" class="btn ghost qz-replay">🔄 Rejouer</button></div>`;
}
function finishQuiz(box, cfg, succ, err, extra){
  const total = succ + err, rate = total ? Math.round(succ/total*100) : 0;
  S.quiz = S.quiz || {};
  S.quiz[cfg.id] = {rate, extra, txt: rate + " % de transformation (" + extra + ")", at: Date.now()};
  persist();
  showResult(box, cfg);
  if (rate >= 80) confetti();
  refresh();
}
function showResult(box, cfg){
  const body = $(".qz-body", box);
  body.innerHTML = resultHTML(cfg, S.quiz[cfg.id]);
  $(".qz-replay", body).addEventListener("click", () => startQuiz(box, cfg));
}
function startQuiz(box, cfg){
  ({cards:playCards, order:playOrder, match:playMatch, who:playWho})[cfg.type](box, cfg);
}
function initQuizzes(){
  $$(".quiz").forEach(box => {
    const cfg = QUIZ[box.dataset.quiz];
    box.innerHTML = `<div class="qz-head"><span class="qz-badge">🎮 Mini-jeu</span><span>${cfg.title}</span></div><p class="qz-intro">${cfg.intro}</p><div class="qz-body"></div>`;
    if (S.quiz && S.quiz[cfg.id]) showResult(box, cfg); else startQuiz(box, cfg);
  });
}

function playCards(box, cfg){
  const body = $(".qz-body", box); let i = 0, ok = 0;
  function render(){
    const q = cfg.q[i];
    body.innerHTML = `<div class="qz-card"><div class="qz-n">Question ${i+1} / ${cfg.q.length}</div>
      <div class="qz-dots">${cfg.q.map((_,k)=>`<i class="${k<i?"d":k===i?"c":""}"></i>`).join("")}</div>
      <div class="qz-emoji">${q.e||cfg.e||"❓"}</div><p class="qz-q">${q.t}</p>
      <div class="qz-opts ${q.o.length===2?"two":""}">${q.o.map((o,k)=>`<button type="button" class="qz-opt" data-opt="${k}">${o}</button>`).join("")}</div>
      <div class="qz-fb" aria-live="polite"></div></div>`;
    $$(".qz-opt", body).forEach(b => b.addEventListener("click", () => answer(+b.dataset.opt)));
  }
  function answer(k){
    const q = cfg.q[i], good = k === q.a;
    if (good) ok++;
    $$(".qz-opt", body).forEach((b,j) => { b.disabled = true; if (j === q.a) b.classList.add("good"); else if (j === k) b.classList.add("bad"); });
    const fb = $(".qz-fb", body);
    fb.className = "qz-fb " + (good ? "ok" : "ko");
    const last = i === cfg.q.length - 1;
    fb.innerHTML = `<b>${(good?QUIZ_GOOD:QUIZ_BAD)[i%5]}</b> ${q.x}<div><button type="button" class="btn qz-next">${last?"Voir mon résultat 🎬":"Question suivante →"}</button></div>`;
    if (!good) { const c = $(".qz-card", body); c.classList.add("shake"); setTimeout(()=>c.classList.remove("shake"),400); }
    $(".qz-next", fb).addEventListener("click", () => {
      if (!last) { i++; render(); }
      else finishQuiz(box, cfg, ok, cfg.q.length - ok, ok + " bonne" + (ok>1?"s":"") + " réponse" + (ok>1?"s":"") + " sur " + cfg.q.length);
    });
  }
  render();
}

function playOrder(box, cfg){
  const body = $(".qz-body", box); let next = 0, err = 0;
  const items = cfg.items.map((t,k)=>({t,k}));
  let sh = shuffle(items); let guard = 0;
  while (sh.every((x,i)=>x.k===i) && guard++ < 20) sh = shuffle(items);
  body.innerHTML = `<div class="qz-ord"><div class="ord-col"><h4>🔀 À remettre dans l'ordre</h4><div class="ord-pool"></div></div>
    <div class="ord-col"><h4>✅ Ma chronologie</h4><ol class="ord-done"></ol></div></div><div class="qz-fb" aria-live="polite"></div>`;
  const pool = $(".ord-pool", body), done = $(".ord-done", body), fb = $(".qz-fb", body);
  sh.forEach(it => {
    const b = document.createElement("button"); b.type = "button"; b.className = "ord-it"; b.textContent = it.t; b.dataset.idx = it.k;
    b.addEventListener("click", () => {
      if (+b.dataset.idx === next) {
        const li = document.createElement("li"); li.textContent = it.t; done.appendChild(li); b.remove(); next++;
        fb.className = "qz-fb ok"; fb.textContent = "👍 Bien joué !";
        if (next === cfg.items.length) finishQuiz(box, cfg, next, err, next + " étapes placées, " + err + " erreur" + (err>1?"s":""));
      } else {
        err++; b.classList.add("shake"); setTimeout(()=>b.classList.remove("shake"),400);
        fb.className = "qz-fb ko"; fb.textContent = "🤔 Pas tout de suite… quelle étape vient avant celle-ci ?";
      }
    });
    pool.appendChild(b);
  });
}

function playMatch(box, cfg){
  const body = $(".qz-body", box); let sel = null, err = 0, done = 0;
  const L = cfg.pairs.map((p,k)=>({t:p[0],k})), R = shuffle(cfg.pairs.map((p,k)=>({t:p[1],k})));
  body.innerHTML = `<div class="mt"><div class="mt-col mt-l"></div><div class="mt-col mt-r"></div></div><div class="qz-fb" aria-live="polite"></div>`;
  const fb = $(".qz-fb", body);
  const mk = (it, col, side) => { const b = document.createElement("button"); b.type="button"; b.className="mt-b"; b.textContent=it.t; b.dataset.idx=it.k; b.dataset.side=side; $(col, body).appendChild(b); return b; };
  L.forEach(it => mk(it, ".mt-l", "l").addEventListener("click", ev => {
    const b = ev.currentTarget; if (b.disabled) return;
    $$(".mt-l .mt-b", body).forEach(x => x.classList.remove("sel")); b.classList.add("sel"); sel = b;
  }));
  R.forEach(it => mk(it, ".mt-r", "r").addEventListener("click", ev => {
    const b = ev.currentTarget; if (b.disabled) return;
    if (!sel) { fb.className = "qz-fb ko"; fb.textContent = "👈 Choisis d'abord une date à gauche."; return; }
    if (sel.dataset.idx === b.dataset.idx) {
      sel.classList.remove("sel"); sel.classList.add("done"); b.classList.add("done"); sel.disabled = true; b.disabled = true; sel = null; done++;
      fb.className = "qz-fb ok"; fb.textContent = "🎯 Bien vu !";
      if (done === cfg.pairs.length) finishQuiz(box, cfg, done, err, done + " paires trouvées, " + err + " erreur" + (err>1?"s":""));
    } else { err++; b.classList.add("shake"); setTimeout(()=>b.classList.remove("shake"),400); fb.className = "qz-fb ko"; fb.textContent = "🙃 Ce n'est pas la bonne paire, retente !"; }
  }));
}

function playWho(box, cfg){
  const body = $(".qz-body", box); let r = 0, clue = 1, wrong = 0, clueSum = 0;
  function render(){
    const R = cfg.rounds[r];
    body.innerHTML = `<div class="qz-card"><div class="qz-n">Mystère ${r+1} / ${cfg.rounds.length}</div>
      <ul class="clues">${R.c.slice(0,clue).map((c,k)=>`<li class="${k===clue-1?"new":""}">🔎 ${c}</li>`).join("")}</ul>
      <button type="button" class="btn ghost more" ${clue>=R.c.length?"disabled":""}>💡 Un indice de plus (${clue}/${R.c.length})</button>
      <div class="qz-opts">${cfg.names.map((n,k)=>`<button type="button" class="qz-opt" data-opt="${k}">${n}</button>`).join("")}</div>
      <div class="qz-fb" aria-live="polite"></div></div>`;
    $(".more", body).addEventListener("click", () => { clue++; render(); });
    $$(".qz-opt", body).forEach(b => b.addEventListener("click", () => guess(b)));
  }
  function guess(b){
    const R = cfg.rounds[r], k = +b.dataset.opt, fb = $(".qz-fb", body);
    if (k === R.a) {
      clueSum += clue; $$(".qz-opt", body).forEach(x => x.disabled = true); b.classList.add("good"); $(".more", body).disabled = true;
      const last = r === cfg.rounds.length - 1;
      fb.className = "qz-fb ok"; fb.innerHTML = `<b>Bravo ! 🎉</b> C'était le ${cfg.names[R.a]}, trouvé avec ${clue} indice${clue>1?"s":""}.<div><button type="button" class="btn qz-next">${last?"Voir mon résultat 🎬":"Mystère suivant →"}</button></div>`;
      $(".qz-next", fb).addEventListener("click", () => {
        if (!last) { r++; clue = 1; render(); }
        else finishQuiz(box, cfg, cfg.rounds.length, wrong, (clueSum/cfg.rounds.length).toFixed(1).replace(".",",") + " indices en moyenne, " + wrong + " erreur" + (wrong>1?"s":""));
      });
    } else {
      wrong++; b.disabled = true; b.classList.add("bad"); const c = $(".qz-card", body); c.classList.add("shake"); setTimeout(()=>c.classList.remove("shake"),400);
      fb.className = "qz-fb ko"; fb.textContent = "🙃 Ce n'est pas ça… demande un indice !";
    }
  }
  render();
}

function chips(id,items,min,max,label){

function mission(id,n,title,mode,body,o={}){
  const story = o.story ? `<p class="story">${o.story}</p>` : "";
  const res = o.res ? `<div class="reslinks">📚 <b>Si tu bloques :</b> ${o.res.map(r=>`<a href="#" data-res="${r[0]}">${r[1]}</a>`).join("")}</div>` : "";
  return `<article class="mission" data-mission="${id}" ${o.optional?"data-optional":""}>
    <div class="stamp">ENREGISTRÉ ✔</div>
    <div class="mhead"><span class="mnum">${n}</span><h3>${title}</h3>${o.optional?'<span class="mode opt">⚡ Bonus</span>':""}<span class="mode ${mode}">${mode==="duo"?"👥 En duo":"👤 En solo"}</span></div>

    <div class="msave"><button type="button" class="btn" data-save="${id}">💾 Enregistrer ma mission</button><span class="mstat" data-stat="${id}"></span></div></article>`;
}

const prev = {};

function buildApp(){

  app.innerHTML = VIEWS.map(k => { const [c,l] = colorOf(k); return `<div class="view" data-view="${k}" style="--c:${c};--l:${l}">${V[k]()}</div>`; }).join("");

function restore(){
  $$("[data-k]").forEach(el => {
    const k = el.dataset.k;
    if (el.type === "checkbox") el.checked = !!S[k];
    else if (el.type === "radio") el.checked = (S[k] === el.value);
    else el.value = S[k] || "";
  });
  if (S.profil) { const pc = $("#profcard"); pc.textContent = S.profil; pc.classList.add("on"); }
  (S._seen || []).forEach(b => showBranch(b, true));
}

/* ---------- état des champs ---------- */
function isDone(el){
  if (el.dataset.quizreq) return !!(S.quiz && S.quiz[el.dataset.quizreq]);
  if (el.hasAttribute("data-datesreq")) return Object.keys(S).filter(k => /^actd\d+$/.test(k) && S[k]).length >= 3;
  if (el.matches(".chips")) { const n = $$("input:checked", el).length; return n >= +el.dataset.min && n <= +el.dataset.max; }
  if (el.hasAttribute("data-radio")) return !!$("input:checked", el);
  return (el.value || "").trim().length > 0;
}
function hasData(m){
  return $$("[data-k]", m).some(el => el.type === "checkbox" || el.type === "radio" ? el.checked : (el.value || "").trim()) || $$(".quiz", m).some(q => S.quiz && S.quiz[q.dataset.quiz]);
}
function sync(el){
  const k = el.dataset.k; if (!k) return;
  if (el.type === "checkbox") {
    const grp = el.closest(".chips");
    if (grp && el.checked && $$("input:checked", grp).length > +grp.dataset.max) {
      el.checked = false; grp.classList.add("shake"); setTimeout(() => grp.classList.remove("shake"), 400);
      toast("Maximum " + grp.dataset.max + " choix : décoche-en un d'abord 😉"); return;
    }
    S[k] = el.checked;
  } else if (el.type === "radio") { if (el.checked) S[k] = el.value; }
  else S[k] = el.value;
  const m = el.closest("[data-mission]");
  if (m && S._m && S._m[m.dataset.mission]) { delete S._m[m.dataset.mission]; toast("✏️ Tu as modifié cette mission : pense à la ré-enregistrer."); }
  persist();
}

/* ---------- missions ---------- */
function saveMission(id){
  const m = $(`[data-mission="${id}"]`);
  const optional = m.hasAttribute("data-optional");
  const missing = $$("[data-req]", m).filter(el => !isDone(el));
  if (optional && !hasData(m)) { toast("Remplis au moins une ligne avant d'enregistrer."); return; }
  if (missing.length) {
    const labels = [...new Set(missing.map(el => el.dataset.label || "un champ"))];
    missing.forEach(el => {
      const t = el.type === "hidden" ? $(".quiz", m) : el.closest(".fld,.qcard,.step") || el;
      if (t) { t.classList.add("miss"); setTimeout(() => t.classList.remove("miss"), 2600); }
    });
    toast("Il manque encore : " + labels.slice(0,3).join(" ; ") + (labels.length > 3 ? "…" : ""));
    const first = missing[0].type === "hidden" ? $(".quiz", m) : missing[0];
    if (first && first.scrollIntoView) first.scrollIntoView({behavior:"smooth", block:"center"});
    return;
  }
  S._m = S._m || {}; S._m[id] = new Date().toISOString(); persist();
  const st = $(".stamp", m); if (st) { st.classList.remove("go"); void st.offsetWidth; st.classList.add("go"); }
  toast("✅ Mission enregistrée !");
  refresh();
}
function fmtDate(iso){ const d = new Date(iso); return d.toLocaleDateString("fr-FR") + " à " + d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); }

/* ---------- style de vendeur ---------- */
function styleResult(){
  const picked = APPET.map((_,i) => S["ap_" + i] ? STYLE_OF[i] : null).filter(Boolean);
  if (picked.length !== 5) return null;
  const cnt = {}; picked.forEach(s => cnt[s] = (cnt[s] || 0) + 1);
  const max = Math.max(...Object.values(cnt));
  return Object.keys(cnt).filter(s => cnt[s] === max).slice(0,2);
}
function updateStyle(){
  const box = $("#stylecard"); if (!box) return;
  const r = styleResult();

  if (r) box.innerHTML = `<b>🔮 Ton style de vendeur·se :</b> ` + r.map(k => `${STYLES[k].e} <b>${STYLES[k].n}</b> — ${STYLES[k].t}`).join(" · ") +
    `<br><small>🧭 À explorer en priorité (une piste, pas un verdict) : ` + r.map(k => STYLES[k].p).join(" / ") + `</small>`;
}

/* ---------- Parcoursup : frise et compte à rebours ---------- */
function updateTimeline(){
  const items = $$("#timeline li"); if (!items.length) return;
  const now = new Date(); let cur = -1;
  items.forEach((li,i) => { if (new Date(li.dataset.from + "T00:00:00") <= now) cur = i; });
  items.forEach((li,i) => { li.classList.toggle("past", i < cur); li.classList.toggle("cur", i === cur); $(".here", li).style.display = i === cur ? "inline-block" : "none"; });
  const nxt = items.find(li => new Date(li.dataset.from + "T00:00:00") > now);
  const cd = $("#countdown");
  if (nxt) { const days = Math.ceil((new Date(nxt.dataset.from + "T00:00:00") - now) / 86400000); cd.textContent = "⏳ Prochaine étape dans " + days + " jour" + (days > 1 ? "s" : "") + " : " + $(".tt", nxt).childNodes[0].textContent; }
  else cd.textContent = "🏁 La session 2027 est terminée.";
}

/* ---------- affichage ---------- */
function updateChips(){
  $$(".chips").forEach(g => {
    const n = $$("input:checked", g).length, mx = +g.dataset.max, mn = +g.dataset.min, c = $(`[data-of="${g.id}"]`);

function updatePitch(){

function paintStars(){

}

function refresh(){
  const by = {}; SK.forEach(k => by[k] = {tot:0, saved:0});
  let tot = 0, saved = 0;
  $$("[data-mission]").forEach(m => {
    const id = m.dataset.mission, key = m.closest(".view").dataset.view, isSaved = !!(S._m && S._m[id]);
    m.classList.toggle("saved", isSaved);
    const st = $(`[data-stat="${id}"]`);
    st.textContent = isSaved ? "✅ Enregistrée le " + fmtDate(S._m[id]) : (hasData(m) ? "📝 Brouillon gardé automatiquement" : "");
    if (m.hasAttribute("data-optional")) return;
    by[key].tot++; tot++; if (isSaved) { by[key].saved++; saved++; }
  });
  const pct = tot ? Math.round(saved / tot * 100) : 0;
  $("#hudTxt").textContent = saved + " / " + tot + " missions enregistrées";
  $("#gbar").style.width = pct + "%"; $("#gpct").textContent = pct + "%";
  S._cel = S._cel || {};
  SK.forEach(k => {
    const b = by[k], p = b.tot ? Math.round(b.saved / b.tot * 100) : 0;
    $(`[data-sbar="${k}"]`).style.width = p + "%";
    $(`[data-spct="${k}"]`).textContent = b.saved + " / " + b.tot + " mission" + (b.tot > 1 ? "s" : "") + " enregistrée" + (b.saved > 1 ? "s" : "");
    $(`[data-qbar="${k}"]`).style.width = p + "%";
    $(`[data-qpct="${k}"]`).textContent = b.saved + " / " + b.tot;
    const complete = b.tot > 0 && b.saved === b.tot;
    $(`[data-ok="${k}"]`).textContent = complete ? " ✅" : "";
    if (complete && !S._cel[k]) { S._cel[k] = true; persist(); if (prev.init) { confetti(); toast("🏆 " + (k === "pcs" ? "Parcoursup" : "Séance " + SBY[k].n) + " terminée ! Pense à télécharger ta sauvegarde (onglet Mon dossier)."); } }
    if (!complete && S._cel[k]) { S._cel[k] = false; persist(); }
  });
  const cert = $("#cert");
  if (cert) { cert.classList.toggle("on", tot > 0 && saved === tot); $("#certName").textContent = S.nom || "Toi"; if (tot > 0 && saved === tot && !S._cert) { S._cert = true; persist(); if (prev.init) { confetti(); setTimeout(confetti, 900); } } }
  const dp = $("#dosProg"); if (dp) dp.textContent = saved + " / " + tot + " missions enregistrées";
  $$(".qcard").forEach(q => q.classList.toggle("done", (($("textarea", q) || {}).value || "").trim().length > 0));
  paintStars(); updateChips(); updatePitch(); updateStyle(); updateTimeline();
  if (curView === "dos") renderDossier();
  prev.init = true;
}

function go(k){

  const act = $("#tabs button.active"); if (act && act.scrollIntoView) act.scrollIntoView({inline:"center", block:"nearest"});
}
function openRes(id){

  const b = $("#resBack"); if (b) b.style.display = resFrom && resFrom !== "res" ? "inline-block" : "none";
  const d = $("#res-" + id);

function showBranch(k, silent){
  $$("[data-branch]").forEach(b => b.classList.toggle("on", b.dataset.branch === k));
  $$(".bl").forEach(b => b.classList.toggle("on", b.dataset.bl === k));

  persist(); if (!silent) refresh();
}

/* ---------- dossier ---------- */
function frDate(v){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v); return m ? m[3] + "/" + m[2] + "/" + m[1] : v; }
function collectMission(m){
  const rows = [], groups = {}, seenR = new Set();
  $$("[data-k]", m).forEach(el => {
    const lab = el.dataset.label || el.dataset.k;
    if (el.type === "checkbox") {
      if (!el.checked) return;
      const g = el.closest(".chips");
      if (g) { (groups[g.id] = groups[g.id] || {label:g.dataset.label, items:[]}).items.push(lab); } else rows.push([lab, "✔ fait"]);
    } else if (el.type === "radio") {
      if (el.checked && !seenR.has(el.name)) { seenR.add(el.name); rows.push([lab, el.closest(".stars") ? el.value + " / 5 ★" : el.value]); }
    } else if (el.type === "hidden") { /* marqueur */ }
    else if ((el.value || "").trim()) rows.push([lab, el.type === "date" ? frDate(el.value.trim()) : el.value.trim()]);
  });
  Object.values(groups).reverse().forEach(g => rows.unshift([g.label, g.items.join(" · ")]));
  $$(".quiz", m).forEach(q => { const r = S.quiz && S.quiz[q.dataset.quiz]; if (r) rows.push(["🎮 " + QUIZ[q.dataset.quiz].title, r.txt]); });
  if (m.dataset.mission === "s1m1") { const st = styleResult(); if (st) rows.push(["Mon style de vendeur·se", st.map(k => STYLES[k].n).join(" + ")]); }
  return rows;
}
function dossierHTML(){
  const nom = (S.nom || "").trim(), cl = (S.classe || "").trim();
  let out = `<h2>Carnet de bord d'orientation 2026 / 2027</h2><p><b>${esc(nom || "Nom non renseigné")}</b>${cl ? " · " + esc(cl) : ""} · édité le ${new Date().toLocaleDateString("fr-FR")}</p>`;
  SEA.forEach(s => {
    const view = $(`.view[data-view="${s.k}"]`);
    out += `<section class="dsec" style="--c:${s.c}"><h3>${s.e} ${s.n === 0 ? "Parcoursup" : "Séance " + s.n} — ${s.t}</h3>`;
    $$("[data-mission]", view).forEach(m => {
      const id = m.dataset.mission, saved = S._m && S._m[id], rows = collectMission(m);
      out += `<div class="dm"><h4>${esc($(".mnum", m).textContent)}. ${$("h3", m).textContent} <span class="ds ${saved ? "ok" : "no"}">${saved ? "✅ enregistrée le " + fmtDate(saved) : "⏳ pas encore enregistrée"}</span></h4>`;
      out += rows.length ? "<dl>" + rows.map(r => `<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join("") + "</dl>" : "<p><em>Rien de renseigné pour l'instant.</em></p>";
      out += "</div>";
    });
    out += "</section>";
  });
  return out;
}
function renderDossier(){ const b = $("#dossierBody"); if (b) b.innerHTML = dossierHTML(); }
const DOS_CSS = "body{font-family:Segoe UI,Roboto,Arial,sans-serif;max-width:860px;margin:24px auto;padding:0 16px;color:#1d2140;line-height:1.5}h2{color:#1F3864}.dsec{margin-top:22px;border-left:8px solid var(--c);padding-left:14px}.dsec h3{color:var(--c)}.dm{background:#faf9ff;border-radius:12px;padding:10px 14px;margin:10px 0;break-inside:avoid}.dm h4{margin:0 0 6px}.dm dt{font-weight:700;color:#5d6385;font-size:14px;margin-top:6px}.dm dd{margin:0 0 4px;white-space:pre-wrap}.ds{font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;margin-left:6px}.ds.ok{background:#dff3e6;color:#14602d}.ds.no{background:#fff1e0;color:#8a4b00}";
function slug(s){ return (s || "").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase(); }
function download(name, text, type){
  const blob = new Blob([text], {type}); const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function downloadJson(){
  download("carnet-orientation-" + (slug(S.nom) || "eleve") + ".json", JSON.stringify({__carnet:"orientation-2026-27", data:S}, null, 1), "application/json");
  toast("💾 Sauvegarde téléchargée : garde-la précieusement !");
}
function downloadHtml(){
  download("dossier-orientation-" + (slug(S.nom) || "eleve") + ".html", `<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Mon dossier d'orientation</title><style>${DOS_CSS}</style></head><body>${dossierHTML()}</body></html>`, "text/html");
  toast("📄 Dossier téléchargé !");
}
function loadJson(file){
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const o = JSON.parse(rd.result);
      if (!o || o.__carnet !== "orientation-2026-27" || typeof o.data !== "object") throw new Error("format");
      S = o.data; persist(); buildApp(); toast("📂 Sauvegarde chargée : bon retour !");
    } catch (e) { toast("❌ Ce fichier n'est pas une sauvegarde de ce carnet."); }
  };
  rd.readAsText(file);
}

/* ---------- chrono ---------- */
let tmr = null;
function startChrono(){
  clearInterval(tmr); let t = 60; const el = $("#timer");
  const draw = () => { el.textContent = "00:" + String(t).padStart(2,"0"); el.classList.toggle("alert", t <= 10); };
  draw(); toast("🎬 À toi : 60 secondes pour convaincre !");
  tmr = setInterval(() => { t--; draw(); if (t <= 0) { clearInterval(tmr); el.textContent = "⏰ Temps !"; toast("⏰ Stop ! Tu as tout dit ?"); } }, 1000);
}

/* ---------- événements ---------- */
document.addEventListener("input", e => { if (e.target.dataset && e.target.dataset.k) { sync(e.target); refresh(); } });
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "fileLoad") { if (t.files[0]) loadJson(t.files[0]); t.value = ""; return; }
  if (!t.dataset || !t.dataset.k) return;

});
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) { go(g.dataset.go); return; }

  if (e.target.closest("#drawBtn")) {
    let i; do { i = Math.floor(Math.random() * PROFILS.length); } while (PROFILS[i] === S.profil && PROFILS.length > 1);
    S.profil = PROFILS[i];
    const inp = $('[data-k="profil"]'); inp.value = S.profil;
    const pc = $("#profcard"); pc.textContent = S.profil; pc.classList.remove("on"); void pc.offsetWidth; pc.classList.add("on");
    const m = inp.closest("[data-mission]"); if (m && S._m) delete S._m[m.dataset.mission];
    persist(); refresh(); return;
  }
  if (e.target.closest("#copyPitch")) {
    const txt = $("#pitchPrev").textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast("📋 Pitch copié !")).catch(() => toast("Sélectionne le texte et fais Ctrl + C"));
    return;
  }
  if (e.target.closest("#chrono")) { startChrono(); return; }
  if (e.target.closest("#btnJson")) { downloadJson(); return; }
  if (e.target.closest("#btnHtml")) { downloadHtml(); return; }
  if (e.target.closest("#btnPrint")) { renderDossier(); window.print(); return; }
  if (e.target.closest("#btnReset")) {
    if (confirm("Tout effacer et recommencer à zéro ? Pense à télécharger ta sauvegarde avant. Cette action est définitive.")) {
      S = {}; try { localStorage.removeItem(KEY); } catch (x) {} prev.init = false; buildApp();
    }
  }
});

/* démarrage */
buildApp();
persist();
</script>
</body>
</html>
